<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var username = "Karthik";
        console.log(username);

        var username = "bijith";
        console.log(username);

        username = "fasil";
        console.log(username);


        let firstName = "zidan";
        console.log(firstName);

        firstName = "niranjan";
        console.log(firstName);
        
        const name = "Dheema";
        console.log(name); 

        const last = "hello";
        console.log(last);

        const num = 234;
        const type = typeof num;
        console.log(type);

        console.log(typeof hello);

        console.log(typeof "heyy");

        console.log(typeof true);   

        console.log(10 + 10);

        console.log(10 + "10");

        console.log(10 + Number("10"));

        console.log(10 == 10);

        console.log(10 === "10");

        console.log(NaN == NaN);
    </script>
</body>
