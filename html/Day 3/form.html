<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <center>
        <h1>User Personal Information</h1>
        <form action="" method="get">
            <label for="name">Enter your full name:</label>
            <input type="text" id="name" name="name" placeholder="Neymar jr" required>
            <br><br>
            <label for="email">Enter your email:</label>
            <input type="email" id="email" name="email" placeholder="neymar@example.com" required>
            <br><br>
            <label for="password">Enter your password:</label>
            <input type="password" id="password" name="password" required>
            <br><br>
            <label for="password_confirm">Confirm your password:</label>
            <input type="password" id="password_confirm" name="password_confirm" required>
            <br><br>
            <label for="gender">Enter your gender:</label>
            <input type="radio" id="gender" name="gender" value="male">Male
            <input type="radio" id="gender" name="gender" value="female">Female
            <input type="radio" id="gender" name="gender" value="other">Others
            <br><br>
            <label for="dob">Enter your date of birth:</label>
            <input type="date" id="dob" name="dob" required>
            <br><br>
            <label for="address">Enter your address:</label>
            <textarea id="address" name="address" placeholder="Enter your address"></textarea>
            <br><br>
            <input type="reset" value="Reset">
            <input type="submit" value="Submit">
        </form>
    </center>
</body>
</html>
