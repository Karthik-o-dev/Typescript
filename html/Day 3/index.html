<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORM</title>
</head>
<body>
    <form>

        <!-- text -->
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>
        <br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br><br>

        <!-- checkbox -->
        <label for="product">Product:</label>
        <input type="checkbox" id="product" name="product" value="yes">Apple
        <input type="checkbox" id="product" name="product" value="yes">Banana
        <input type="checkbox" id="product" name="product" value="yes">Mango
        <br><br>
        <!-- password -->
        <label for="Password">Password:</label>
        <input type="password" id="Password" name="Password" required>
        <br><br>
        <input type="color">
        <br><br>
<!-- radio -->
        <label for="Gender">Gender:</label>
        <input type="radio" id="Gender" name="Gender" value="male">Male
        
        <input type="radio" id="Gender" name="Gender" value="female">Female
        
<br><br>

<!-- date -->
        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob">
        <br><br>
        <label for="time">Time:</label>
        <input type="time" id="time" name="time">
        <br><br>
        <label for="number">Number:</label>
        <input type="number" id="number" name="number">
        <br><br>
<!-- select -->

        <select name="City" id="City">
            <option value="select">Select</option>
            <option value="Kochi">Kochi</option>
            <option value="Calicut">Calicut</option>
            <option value="Kannur">Kannur</option>
        </select>
        <br><br>

<textarea name="Address" id="Address" placeholder="Address"></textarea>
<br><br>

<input type="file" id="file" name="file">
<br><br>    


<label for="range">Range:</label>
        <input type="range" id="range" name="range" min="1" max="100">
        <br><br>

        
<label for="number">Phone Number:</label>
<input type="tel" name="number" id="number " required>
<input type="reset" value="Reset" >
        <input type="submit" value="Submit">
    </form>

</body>
</html>
