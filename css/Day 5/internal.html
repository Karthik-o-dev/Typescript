<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Edu+VIC+WA+NT+Hand:wght@400..700&display=swap" rel="stylesheet">
    <style>
       

        body{
            background-color: rgb(136, 172, 181);
            border: 2px solid white;
            border-radius: 10px;
            bor

        }
        #dma{
            color: rgb(133, 11, 11);
            font-family: 'Edu VIC WA NT Hand', cursive;
            font-weight: bold;
            font-size: 50px;
            text-align: center;
            border: 2px solid rgb(7, 25, 234);
            border-radius: 10px;
                        
        }
        .form{
            background-color: rgb(236, 198, 171);
            text-align: center;
            border: 2px solid rgb(0, 0, 0);
            border-radius: 10px;
        }
        .form-label{
            color: rgb(0, 0, 0);
            font-family: 'Edu VIC WA NT Hand', cursive;
        }
        .form-input{
            color: rgb(21, 15, 209);
            border: 2px solid rgb(0, 0, 0);
            font-weight: bold;
            font-style: italic;


        }


    </style>
</head>
<body>

        <h1 id="dma">User Personal Information</h1>
        <form class="form" action="" method="get">
            <label class="form-label" for="name">Enter your full name:</label>
            <input class="form-input" type="text" id="name" name="name" placeholder="Neymar jr" required>
            <br><br>
            <label class="form-label" for="email">Enter your email:</label>
            <input class="form-input" type="email" id="email" name="email" placeholder="neymar@example.com" required>
            <br><br>
            <label class="form-label" for="password">Enter your password:</label>
            <input class="form-input" type="password" id="password" name="password" required>
            <br><br>
            <label class="form-label" for="password_confirm">Confirm your password:</label>
            <input class="form-input" type="password" id="password_confirm" name="password_confirm" required>
            <br><br>
            <label class="form-label" for="gender">Enter your gender:</label>
            <input class="form-input" type="radio" id="gender" name="gender" value="male">Male
            <input class="form-input" type="radio" id="gender" name="gender" value="female">Female
            <input class="form-input" type="radio" id="gender" name="gender" value="other">Others
            <br><br>
            <label class="form-label" for="dob">Enter your date of birth:</label>
            <input class="form-input" type="date" id="dob" name="dob" required>
            <br><br>
            <label class="form-label" for="address">Enter your address:</label>
            <textarea class="form-input" id="address" name="address" placeholder="Enter your address"></textarea>
            <br><br>
            <input class="form-input" type="reset" value="Reset">
            <input class="form-input" type="submit" value="Submit">
        </form>
    
</body>
</html>
