<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            margin: 0;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(10, auto);
            height: 100vh;
            gap: 5px;
        }
        .child1{
            background-color: aqua;
            grid-column: 1/3;
            grid-row: 1/8;
        }
        .child2{
            background-color: rgb(9, 79, 79);
            grid-column: 1;
            grid-row: 8/11;
        }
        .child3{
            background-color: rgb(147, 153, 26);
            grid-column: 2;
            grid-row: 8/11;
        }
        .child4{
            background-color: rgb(230, 235, 139);
            grid-column: 3;
            grid-row: 1/4;
        }
        .child5{
            background-color: rgb(28, 30, 7);
            grid-column: 3;
            grid-row: 4/8;
        }
        .child6{
            background-color: rgb(8, 120, 133);
            grid-column: 3;
            grid-row: 8/11;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="child1"></div>
        <div class="child2"></div>
        <div class="child3"></div>
        <div class="child4"></div>
        <div class="child5"></div>
        <div class="child6"></div>
    </div>
</body>
</html>
