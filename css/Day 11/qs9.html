<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            gap: 5px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(10, 1fr);
            height: 100vh;
        }
        .child1{
            background-color: antiquewhite;
            grid-column: 1;
            grid-row: 1/4;
        }
        .child2{
            background-color: antiquewhite;
            grid-column: 2;
            grid-row: 1/4;
        }
        .child3{
            background-color: antiquewhite;
            grid-column: 3;
            grid-row: 1/4;
        }
        .child4{
            background-color: antiquewhite;
            grid-column: 4;
            grid-row: 1/4;
        }
        .child5{
            background-color: rgb(208, 134, 37);
            grid-column: 1/3;
            grid-row: 4/8;
        }
        .child6{
            background-color: rgb(208, 134, 37);
            grid-column: 3/5;
            grid-row: 4/8;
        }
        .child7{
            background-color: antiquewhite;
            grid-column: 1;
            grid-row: 8/11;
        }
        .child8{
            background-color: antiquewhite;
            grid-column: 2;
            grid-row: 8/11;
        }
        .child9{
            background-color: antiquewhite;
            grid-column: 3;
            grid-row: 8/11;
        }
        .child10{
            background-color: antiquewhite;
            grid-column: 4;
            grid-row: 8/11;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="child1"></div>
        <div class="child2"></div>
        <div class="child3"></div>
        <div class="child4"></div>
        <div class="child5"></div>
        <div class="child6"></div>
        <div class="child7"></div>
        <div class="child8"></div>
        <div class="child9"></div>
        <div class="child10"></div>
    </div>
</body>
</html>
